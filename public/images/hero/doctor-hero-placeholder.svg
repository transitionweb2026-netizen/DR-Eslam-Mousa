<svg width="1200" height="1500" viewBox="0 0 1200 1500" xmlns="http://www.w3.org/2000/svg" role="img" aria-hidden="true">
  <defs>
    
  <linearGradient id="hero-doctor-bg" x1="88.3022221559489%" y1="17.86061951567303%" x2="11.697777844051103%" y2="82.13938048432698%">
    <stop offset="0" stop-color="#171240" />
    <stop offset="0.55" stop-color="#150f3f" />
    <stop offset="1" stop-color="#0e0b28" />
  </linearGradient>
  <linearGradient id="hero-doctor-brand" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0" stop-color="#b9a9ff" />
    <stop offset="1" stop-color="#5cc4ee" />
  </linearGradient>
  <radialGradient id="hero-doctor-glow" cx="50%" cy="30%" r="70%">
    <stop offset="0" stop-color="#009EE3" stop-opacity="0.22" />
    <stop offset="1" stop-color="#009EE3" stop-opacity="0" />
  </radialGradient>
  <radialGradient id="hero-doctor-glow2" cx="15%" cy="100%" r="65%">
    <stop offset="0" stop-color="#2F2483" stop-opacity="0.35" />
    <stop offset="1" stop-color="#2F2483" stop-opacity="0" />
  </radialGradient>
    <linearGradient id="hero-doctor-figure" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0" stop-color="#7a6cd6" />
      <stop offset="1" stop-color="#009EE3" />
    </linearGradient>
    <clipPath id="hero-doctor-clip"><rect width="1200" height="1500" rx="0" /></clipPath>
  </defs>
  <rect width="1200" height="1500" fill="url(#hero-doctor-bg)" />
  <g clip-path="url(#hero-doctor-clip)">
    
  <pattern id="hero-doctor-dots" width="26" height="26" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1.4" fill="#ffffff" opacity="0.06" />
  </pattern>
  <rect width="1200" height="1500" fill="url(#hero-doctor-dots)" />
    <rect width="1200" height="1500" fill="url(#hero-doctor-glow)" />
    <rect width="1200" height="1500" fill="url(#hero-doctor-glow2)" />
    <circle cx="983.9999999999999" cy="210.00000000000003" r="336.00000000000006" fill="#009EE3" opacity="0.14" />
    <circle cx="96" cy="1380" r="288" fill="#2F2483" opacity="0.22" />

    <!-- coat / shoulders -->
    <path d="M228 1500
             C 228 1080, 292.79999999999995 1215, 600 1290
             C 907.2 1215, 972 1080, 972 1500 Z"
          fill="url(#hero-doctor-figure)" opacity="0.9" />
    <path d="M600 1260 L600 1500" stroke="#ffffff" stroke-width="9.6" opacity="0.22" />

    <!-- collar -->
    <path d="M427.2 1245 L600 1365 L772.8 1245"
          fill="none" stroke="#ffffff" stroke-width="12" opacity="0.4" stroke-linecap="round" />

    <!-- stethoscope loop -->
    <path d="M494.4 1320 q0 135 105.60000000000001 135 q105.60000000000001 0 105.60000000000001 -135"
          fill="none" stroke="#ffffff" stroke-width="14.4" opacity="0.4" stroke-linecap="round" />

    <!-- head -->
    <circle cx="600" cy="886.8" r="192" fill="url(#hero-doctor-figure)" opacity="0.9" />
    <circle cx="600" cy="886.8" r="192" fill="none" stroke="#ffffff" stroke-width="7.2" opacity="0.2" />
    <circle cx="600" cy="886.8" r="259.20000000000005" fill="none" stroke="url(#hero-doctor-brand)" stroke-width="3.6" opacity="0.35" />
  </g>
</svg>
