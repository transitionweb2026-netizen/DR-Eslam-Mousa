<svg width="900" height="1200" viewBox="0 0 900 1200" xmlns="http://www.w3.org/2000/svg" role="img" aria-hidden="true">
  <defs>
    
  <linearGradient id="trust-doctor-bg" x1="93.30127018922194%" y1="25.000000000000004%" x2="6.698729810778062%" y2="75%">
    <stop offset="0" stop-color="#171240" />
    <stop offset="0.55" stop-color="#150f3f" />
    <stop offset="1" stop-color="#0e0b28" />
  </linearGradient>
  <linearGradient id="trust-doctor-brand" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0" stop-color="#b9a9ff" />
    <stop offset="1" stop-color="#5cc4ee" />
  </linearGradient>
  <radialGradient id="trust-doctor-glow" cx="50%" cy="30%" r="70%">
    <stop offset="0" stop-color="#009EE3" stop-opacity="0.22" />
    <stop offset="1" stop-color="#009EE3" stop-opacity="0" />
  </radialGradient>
  <radialGradient id="trust-doctor-glow2" cx="15%" cy="100%" r="65%">
    <stop offset="0" stop-color="#2F2483" stop-opacity="0.35" />
    <stop offset="1" stop-color="#2F2483" stop-opacity="0" />
  </radialGradient>
    <linearGradient id="trust-doctor-figure" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0" stop-color="#7a6cd6" />
      <stop offset="1" stop-color="#009EE3" />
    </linearGradient>
    <clipPath id="trust-doctor-clip"><rect width="900" height="1200" rx="0" /></clipPath>
  </defs>
  <rect width="900" height="1200" fill="url(#trust-doctor-bg)" />
  <g clip-path="url(#trust-doctor-clip)">
    
  <pattern id="trust-doctor-dots" width="26" height="26" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1.4" fill="#ffffff" opacity="0.06" />
  </pattern>
  <rect width="900" height="1200" fill="url(#trust-doctor-dots)" />
    <rect width="900" height="1200" fill="url(#trust-doctor-glow)" />
    <rect width="900" height="1200" fill="url(#trust-doctor-glow2)" />
    <circle cx="738" cy="168.00000000000003" r="252.00000000000003" fill="#009EE3" opacity="0.14" />
    <circle cx="72" cy="1104" r="216" fill="#2F2483" opacity="0.22" />

    <!-- coat / shoulders -->
    <path d="M171 1200
             C 171 912, 234 1020, 450 1080
             C 666 1020, 729 912, 729 1200 Z"
          fill="url(#trust-doctor-figure)" opacity="0.9" />
    <path d="M450 1056 L450 1200" stroke="#ffffff" stroke-width="7.2" opacity="0.22" />

    <!-- collar -->
    <path d="M328.5 1044 L450 1140 L571.5 1044"
          fill="none" stroke="#ffffff" stroke-width="9" opacity="0.4" stroke-linecap="round" />

    <!-- stethoscope loop -->
    <path d="M375.75 1104 q0 108 74.25 108 q74.25 0 74.25 -108"
          fill="none" stroke="#ffffff" stroke-width="10.8" opacity="0.4" stroke-linecap="round" />

    <!-- head -->
    <circle cx="450" cy="796.5" r="135" fill="url(#trust-doctor-figure)" opacity="0.9" />
    <circle cx="450" cy="796.5" r="135" fill="none" stroke="#ffffff" stroke-width="5.4" opacity="0.2" />
    <circle cx="450" cy="796.5" r="182.25" fill="none" stroke="url(#trust-doctor-brand)" stroke-width="2.7" opacity="0.35" />
  </g>
</svg>
