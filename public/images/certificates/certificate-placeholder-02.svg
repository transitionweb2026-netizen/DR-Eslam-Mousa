<svg width="700" height="900" viewBox="0 0 700 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-hidden="true">
  <defs>
  <linearGradient id="certificate-placeholder-02-l-bg" x1="88.3022221559489%" y1="17.86061951567303%" x2="11.697777844051103%" y2="82.13938048432698%">
    <stop offset="0" stop-color="#EEECFB" />
    <stop offset="0.55" stop-color="#E5F6FD" />
    <stop offset="1" stop-color="#ffffff" />
  </linearGradient>
  <linearGradient id="certificate-placeholder-02-l-brand" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0" stop-color="#2F2483" />
    <stop offset="1" stop-color="#009EE3" />
  </linearGradient></defs>
  <rect width="700" height="900" fill="url(#certificate-placeholder-02-l-bg)" />
  
  <pattern id="certificate-placeholder-02-l-dots" width="26" height="26" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1.5" fill="#2F2483" opacity="0.07" />
  </pattern>
  <rect width="700" height="900" fill="url(#certificate-placeholder-02-l-dots)" />
  <!-- outer + inner decorative border, like a physical certificate -->
  <rect x="28" y="28" width="644" height="844" rx="18" fill="none" stroke="url(#certificate-placeholder-02-l-brand)" stroke-width="2.5" opacity="0.55" />
  <rect x="42" y="42" width="616" height="816" rx="12" fill="none" stroke="#2F2483" stroke-width="1" opacity="0.22" />

  <!-- seal / medal -->
  <circle cx="350" cy="306" r="86" fill="#ffffff" opacity="0.7" />
  <circle cx="350" cy="306" r="86" fill="none" stroke="url(#certificate-placeholder-02-l-brand)" stroke-width="2.5" />
  <circle cx="350" cy="306" r="66" fill="none" stroke="url(#certificate-placeholder-02-l-brand)" stroke-width="1.2" opacity="0.6" />
  <path d="M324 312 l16 18 34 -40" fill="none" stroke="url(#certificate-placeholder-02-l-brand)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M330 388 l20 46 -20 -14 -20 14 z" fill="url(#certificate-placeholder-02-l-brand)" opacity="0.85" />

  <!-- decorative text lines (real title/institution render as HTML over this) -->
  <rect x="154" y="576" width="392.00000000000006" height="10" rx="5" fill="#2F2483" opacity="0.16" />
  <rect x="210" y="616.5" width="280" height="8" rx="4" fill="#2F2483" opacity="0.12" />
  <rect x="252" y="657" width="196.00000000000003" height="8" rx="4" fill="#009EE3" opacity="0.16" />

  <circle cx="630" cy="108" r="40" fill="#009EE3" opacity="0.14" />
  <circle cx="70" cy="810" r="46" fill="#2F2483" opacity="0.12" />
</svg>
